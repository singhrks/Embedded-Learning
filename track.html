<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track | Embedded Learning Hub</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
<main class="content" id="main"></main>
</div>
<script src="assets/js/site.js"></script>
<script>
window.renderPage = function () {
  var id = new URLSearchParams(location.search).get("t");
  var tr = TRACKS.filter(function (x) { return x.id === id; })[0];
  var m = document.getElementById("main");

  if (!tr) {
    m.innerHTML = '<h1>Track not found</h1><p><a href="index.html">Back to the home page</a>.</p>';
    return;
  }

  var done = tr.p.filter(function (p) { return p[2]; }).length;
  var pct = Math.round(done / tr.p.length * 100);

  var rows = tr.p.map(function (p, i) {
    var n = String(i + 1).padStart(2, "0");
    return p[2]
      ? '<a href="' + p[0] + '"><span class="n">' + n + '</span><span>' + p[1] + '</span></a>'
      : '<span class="pend"><span class="n">' + n + '</span><span>' + p[1] +
        '</span><span class="tag">drafting</span></span>';
  }).join("");

  var idx = TRACKS.indexOf(tr);
  var prev = TRACKS[idx - 1], next = TRACKS[idx + 1];

  m.innerHTML =
    '<p class="crumbs"><a href="index.html">Home</a> / track</p>' +
    '<div class="track-hero"><span class="trk-ic">' + tr.ic + '</span>' +
    '<h1>' + tr.n + '</h1><p class="lead">' + tr.d + '</p></div>' +
    '<div class="bar" style="max-width:420px"><i style="width:' + pct + '%"></i></div>' +
    '<p style="font-family:var(--mono);font-size:12px;color:var(--text-faint);margin:8px 0 26px">' +
      done + ' of ' + tr.p.length + ' chapters published &middot; ' + pct + '%</p>' +
    '<h2>Chapters</h2><div class="chlist">' + rows + '</div>' +
    '<nav class="pagenav">' +
      (prev ? '<a href="track.html?t=' + prev.id + '"><span class="dir">&larr; previous track</span>' +
              '<span class="ttl">' + prev.n + '</span></a>' : '') +
      (next ? '<a class="next" href="track.html?t=' + next.id + '"><span class="dir">next track &rarr;</span>' +
              '<span class="ttl">' + next.n + '</span></a>' : '') +
    '</nav>';

  document.title = tr.n.replace(/&amp;/g, "&") + " | Embedded Learning Hub";
};
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
